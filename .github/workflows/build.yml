name: Build OpenWrt Firmware for Zyxel VMG8825-T50

on:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-23.05
  ECONET_REPO: https://github.com/ndmsystems/kernel-49
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget qemu-utils \
          libelf-dev device-tree-compiler python3-setuptools python3-yaml \
          swig antlr3 gperf autoconf automake libtool ccache ecj fastjar \
          java-propose-classpath libncursesw5-dev xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        
    - name: Clone OpenWrt source
      run: |
        df -hT $PWD
        git clone --depth 1 $OPENWRT_REPO -b $OPENWRT_BRANCH openwrt-build
        cd openwrt-build
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        
    - name: Update and install feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Copy custom target configuration
      run: |
        echo "Copying EN75xx target configuration..."
        cp -r target/linux/en75xx $OPENWRT_PATH/target/linux/
        
    - name: Copy custom .config
      run: |
        echo "Copying .config file..."
        cp .config $OPENWRT_PATH/.config
        
    - name: Apply EcoNet EN7516 patches
      run: |
        cd $OPENWRT_PATH
        
        # Create patches directory
        mkdir -p target/linux/en75xx/patches-5.15
        
        # Apply basic MIPS architecture patches for EN7516
        cat > target/linux/en75xx/patches-5.15/001-en7516-platform-support.patch << 'EOF'
--- /dev/null
+++ b/arch/mips/boot/dts/econet/Makefile
@@ -0,0 +1,2 @@
+# SPDX-License-Identifier: GPL-2.0
+dtb-$(CONFIG_SOC_EN75XX) += en7516-vmg8825-t50.dtb
--- /dev/null
+++ b/arch/mips/econet/Kconfig
@@ -0,0 +1,13 @@
+# SPDX-License-Identifier: GPL-2.0
+if MIPS_ECONET
+
+config SOC_EN75XX
+	bool "EcoNet EN75xx SoC"
+	select SYS_HAS_CPU_MIPS32_R2
+	select SYS_SUPPORTS_BIG_ENDIAN
+	select SYS_SUPPORTS_32BIT_KERNEL
+	select MIPS_L1_CACHE_SHIFT_5
+	help
+	  This enables support for EcoNet EN75xx series SoCs.
+
+endif
EOF
        
        echo "EcoNet EN7516 patches created and applied"
        
    - name: Download packages
      id: package
      run: |
        cd $OPENWRT_PATH
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        
    - name: Check space usage
      if: always()
      run: df -hT
      
    - name: Upload bin directory
      uses: actions/upload-artifact@v3
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin
        
    - name: Organize firmware files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware directory
      uses: actions/upload-artifact@v3
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=vmg8825-t50-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "## OpenWrt Firmware for Zyxel VMG8825-T50" >> release.txt
        echo "" >> release.txt
        echo "### Build Information" >> release.txt
        echo "- **Target**: EN75xx / EN751627" >> release.txt
        echo "- **Device**: Zyxel VMG8825-T50" >> release.txt
        echo "- **Architecture**: MIPS 1004Kc Big Endian" >> release.txt
        echo "- **Build Date**: $(date +'%Y-%m-%d %H:%M:%S')" >> release.txt
        echo "" >> release.txt
        echo "### Features" >> release.txt
        echo "- ✅ USB 2.0 and 3.0 support enabled" >> release.txt
        echo "- ✅ WiFi drivers: RTL8187, RT2800-USB, MT76" >> release.txt
        echo "- ✅ WISP/Relay support (relayd, luci-proto-relay)" >> release.txt
        echo "- ✅ Wireless tools: wpa-supplicant, wireless-tools" >> release.txt
        echo "" >> release.txt
        echo "### Installation" >> release.txt
        echo "1. Download the appropriate firmware file (.bin or .img)" >> release.txt
        echo "2. Upload via router web interface or use sysupgrade" >> release.txt
        echo "3. Wait for the router to reboot" >> release.txt
        echo "" >> release.txt
        echo "### Included Packages" >> release.txt
        echo "- USB support: kmod-usb-core, kmod-usb-ohci, kmod-usb2, kmod-usb3" >> release.txt
        echo "- WiFi drivers: kmod-rtl8187, kmod-rt2800-usb, kmod-mt76" >> release.txt
        echo "- Wireless tools: wpa-supplicant, wireless-tools" >> release.txt
        echo "- WISP/Relay: relayd, luci-proto-relay" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: ${{ env.OPENWRT_PATH }}/release.txt
        files: ${{ env.FIRMWARE }}/*
        
    - name: Clean up workspace
      if: always()
      run: |
        cd $OPENWRT_PATH
        rm -rf .ccache
        df -hT $PWD
